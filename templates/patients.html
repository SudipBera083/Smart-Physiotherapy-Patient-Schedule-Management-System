{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>Patients</h2>
    <a href="#" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add Patient</a>
</div>

<table class="table table-bordered mt-4">
    <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Status</th>
            <th>Last Visit</th>
            <th>Pending Due</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- Example static row (Will be dynamic later) -->
        <tr>
            <td>1</td>
            <td>Ramesh Kumar</td>
            <td>9876543210</td>
            <td><span class="badge bg-success">Regular</span></td>
            <td>12 Feb 2025</td>
            <td><span class="badge bg-danger">₹100 Due</span></td>
            <td>
                <button class="btn btn-sm btn-info">View</button>
                <button class="btn btn-sm btn-warning">Edit</button>
                <button class="btn btn-sm btn-danger">Delete</button>
            </td>
        </tr>
    </tbody>
</table>
{% endblock %}
