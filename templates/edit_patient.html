{% extends 'base.html' %}

{% block content %}
<h2>Edit Patient</h2>

<form method="POST" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ patient.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Contact</label>
        <input type="text" name="contact" class="form-control" value="{{ patient.contact }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="2">{{ patient.address }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Total Fee (₹)</label>
        <input type="number" name="total_fee" class="form-control" value="{{ patient.total_fee }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2">{{ patient.notes }}</textarea>
    </div>
    <button class="btn btn-success">💾 Update Patient</button>
    <a href="{% url 'patients' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
